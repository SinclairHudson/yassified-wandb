<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yassified W&B</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Yassified W&B</h1>
          <p>Presentation mode for your plots.</p>
        </div>
        <label class="switch" aria-label="Enable Yassified W&B">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <section aria-labelledby="type-heading">
        <h2 id="type-heading">Typography</h2>
        <div class="size-grid">
          <label>
            <span>Plot titles</span>
            <span class="number-wrap"><input id="title-size" type="number" min="12" max="40"><small>px</small></span>
          </label>
          <label>
            <span>Legend names</span>
            <span class="number-wrap"><input id="legend-size" type="number" min="10" max="32"><small>px</small></span>
          </label>
        </div>
      </section>

      <section aria-labelledby="mapping-heading">
        <div class="section-heading">
          <div>
            <h2 id="mapping-heading">Title mappings</h2>
            <p>Exact title → display title</p>
          </div>
          <button id="add-mapping" class="secondary" type="button">+ Add</button>
        </div>
        <div id="mappings"></div>
      </section>

      <footer>
        <span id="status" role="status" aria-live="polite"></span>
        <button id="save" type="button">Save changes</button>
      </footer>
    </main>

    <template id="mapping-template">
      <div class="mapping-row">
        <label>
          <span class="sr-only">Original W&B title</span>
          <textarea class="mapping-from" rows="2" placeholder="val/metric_name"></textarea>
        </label>
        <span class="arrow" aria-hidden="true">→</span>
        <label>
          <span class="sr-only">Presentation title</span>
          <input class="mapping-to" type="text" placeholder="Validation score">
        </label>
        <button class="remove" type="button" aria-label="Remove mapping">×</button>
      </div>
    </template>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
